# Secrets are stored in .env file. It is pushed to github but only for dev environment.

services:
  nexticz.nexty.jipocar.api:
    image: nexticz.nexty.jipocar.api:3.0.0
    build:
      context: .
      dockerfile: Nexticz.Nexty.Jipocar.Api/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Docker
      - TZ=Europe/Prague
      - ASPNETCORE_URLS=https://+:5500
      - ASPNETCORE_Kestrel__Certificates__Default__Password=password
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/local.dev.pfx
    depends_on:
      - rabbitmq
      - postgres
      - mssql
      - elasticsearch
    ports:
      - "5500:5500"
    volumes:
      - ./DockerData/assets:/app/iwms/assets
      - ./DockerData/logs/iwmsbe:/app/logs
      - ./Nexticz.Nexty.Jipocar.Api/ssl:/https:ro
    mem_limit: 10g
    cpus: 2
    restart: always
  
  rabbitmq:
    build:
      context: .
      dockerfile: ../../../../RabbitMqDockerfile
    container_name: rabbitmq
    ports:
      - "5672:5672" # Messaging port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: Password1!
      TZ: Europe/Prague
    volumes:
      - ./DockerData/rabbitmq:/var/lib/rabbitmq
    mem_limit: 4g
    cpus: 2
    restart: always

  postgres:
    image: postgres:17
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password1!
      POSTGRES_DB: iwms-dev
      TZ: Europe/Prague
    volumes:
      - ./DockerData/postgres:/var/lib/postgresql/data
    mem_limit: 4g
    cpus: 2
    restart: always

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=DevSql!Secret0Password
      - TZ=Europe/Prague
    ports:
      - "1433:1433"
    user: root
    volumes:
      - ./DockerData/mssql/data:/var/opt/mssql/data
      - ./DockerData/mssql/log:/var/opt/mssql/log
      - ./DockerData/mssql/secrets:/var/opt/mssql/secrets
    command: /bin/bash -c "apt-get update && apt-get install -y tzdata && chown -R mssql /var/opt/mssql && /opt/mssql/bin/sqlservr"
    mem_limit: 4g
    cpus: 2
    restart: always

  ftp:
    image: lhauspie/vsftpd-alpine:latest
    container_name: ftp-server
    ports:
      - "990:990"
      - "21100-21110:21100-21110" # Passive mode ports
    environment:
      - FTP_USER=user
      - FTP_PASS=pass
      - FTP_MODE=ftps_implicit    # Enables implicit FTPS
      - PASV_ADDRESS=127.0.0.1
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
      - PASV_ENABLE=YES
      - LOG_STDOUT=YES
    volumes:
      - ./DockerData/ftps/SIGN/TransferDocuments:/home/vsftpd/user/Prepravni_dokumenty/in
    mem_limit: 4g
    cpus: 2
    restart: always
    
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./DockerData/elasticsearch:/usr/share/elasticsearch/data
 


    